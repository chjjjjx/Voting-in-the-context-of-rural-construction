<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花木共创 · 投票记录后台</title>
<script src="./config.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script>
if (!window.cloudbase) {
  const mirror = 'https://imgcache.qq.com/qcloud/cloudbase-js-sdk/latest/';
  ['cloudbase.js','cloudbase.auth.js','cloudbase.storage.js','cloudbase.database.js'].forEach(file => {
    document.write('<script src="' + mirror + file + '"><\/script>');
  });
}
</script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#26332b;background:#f4f6f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{background:#244b35;color:#fff;padding:18px max(16px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.top h1{font-size:23px;margin:0}.top p{font-size:13px;opacity:.82;margin:5px 0 0}.wrap{max-width:1120px;margin:auto;padding:22px 16px 56px}.login,.toolbar,.point{background:#fff;border:1px solid #e2e8df;border-radius:16px;box-shadow:0 4px 20px #1e39200a}.login{max-width:430px;margin:8vh auto;padding:24px}.login h2{margin:0 0 18px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:14px;font-weight:650}.field input{width:100%;height:46px;border:1px solid #dce3d9;border-radius:10px;padding:0 12px;font-size:16px}.btn{border:0;border-radius:10px;background:#2f6747;color:#fff;font-size:15px;font-weight:700;padding:11px 16px;min-height:44px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.btn.danger{background:#a3483d;color:#fff}.reset-help{font-size:12px;color:#8a6c62;margin-top:5px;line-height:1.5}.btn.light{background:#eaf1e9;color:#355e40}.login .btn{width:100%;margin-top:7px}.hint{color:#738074;font-size:13px;line-height:1.6}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:15px;flex-wrap:wrap}.totals{font-size:14px;color:#5c6b5e}.totals strong{font-size:21px;color:#244b35;margin-right:3px}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.points{display:grid;gap:13px}.point{overflow:hidden}.point-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fafcf8;border-bottom:1px solid #e9eee7}.point-title{font-size:18px;font-weight:750}.point-title small{color:#7b897c;font-size:13px;font-weight:500;margin-left:8px}.point-meta{font-size:13px;color:#728073;text-align:right}.point-body{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:16px;padding:14px}.works{display:grid;gap:8px;align-content:start}.section-title{font-size:14px;font-weight:700;margin:1px 0}.work{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:10px;border:1px solid #edf0eb;border-radius:11px;align-items:center}.work-thumb{width:48px;height:48px;border-radius:8px;border:1px solid #e2e8df;background:#f1f4ed;display:grid;place-items:center;overflow:hidden;color:#8c9b89;font-size:20px}.work-thumb img{display:block;width:100%;height:100%;object-fit:cover}.work-copy{min-width:0}.work-copy .work-name{overflow-wrap:anywhere}.work-name{font-size:14px;font-weight:650}.work-count{color:#315d40;font-weight:750;font-size:17px;white-space:nowrap}.work-count small{font-size:12px;font-weight:500;color:#7b897c}.bar{height:6px;background:#edf1ea;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#76a27b;border-radius:9px}.feedback-list{display:grid;gap:8px}.feedback{padding:11px 12px;background:#f8faf7;border-radius:11px;border:1px solid #edf0eb}.feedback-top{display:flex;justify-content:space-between;gap:10px;color:#7c887d;font-size:12px;margin-bottom:7px}.feedback-text{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.feedback audio{width:100%;height:38px;margin-top:7px}.empty{color:#929d92;font-size:13px;padding:8px 0}.status{color:#fff;background:#8b5b37;border-radius:8px;padding:9px 12px;font-size:13px;white-space:nowrap}.status.ok{background:#3d764f}.status.error{background:#963e37}.hidden{display:none!important}.all-empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#758174;line-height:1.7}.login-status{font-size:13px;color:#718071;min-height:20px;margin-top:10px;line-height:1.5}.export-note{font-size:12px;color:#7b897c;margin-top:3px}@media(max-width:700px){.top{padding:14px}.top h1{font-size:19px}.wrap{padding:13px 10px 38px}.toolbar{padding:11px;align-items:flex-start}.point-head{padding:12px}.point-title{font-size:16px}.point-body{grid-template-columns:1fr;gap:13px;padding:11px}.work{padding:10px}.login{margin:5vh auto;padding:20px}.toolbar-actions .btn{font-size:13px;padding:9px 11px}}
</style>
</head>
<body>
<header class="top"><div><h1>花木共创 · 投票记录后台</h1><p>查看点位投票、方案图片和村民意见</p></div><div id="state" class="status">请登录</div></header>
<main class="wrap">
<section id="login" class="login"><h2>编辑者登录</h2><div class="field"><label for="username">编辑者账号</label><input id="username" autocomplete="username" placeholder="请输入账号"></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div><button id="loginBtn" class="btn">登录并查看记录</button><div id="loginStatus" class="login-status"></div></section>
<section id="dashboard" class="hidden"><div class="toolbar"><div><div class="totals"><strong id="spotTotal">0</strong>个点位　<strong id="voteTotal">0</strong>票　<strong id="feedbackTotal">0</strong>条意见</div><div class="export-note">点位直接读取地图数据库，新增点位后点击刷新即可同步。</div><div class="reset-help">清空只删除票数和村民意见，点位、作品和图片会保留。</div></div><div class="toolbar-actions"><button id="refreshBtn" class="btn light">刷新数据</button><button id="exportBtn" class="btn light">导出 CSV</button><button id="resetVotingBtn" class="btn danger">清空重新投票</button><button id="logoutBtn" class="btn">退出</button></div></div><div id="points" class="points"></div></section>
</main>
<script>
/* 云端配置统一从 config.js 读取；config.example.js 是可入库的模板。 */
const CONFIG = window.HUAMU_CONFIG || {};
const ENV_ID = CONFIG.envId;
const PUBLISHABLE_KEY = CONFIG.publishableKey;
const REGION = CONFIG.region || 'ap-shanghai';
const VILLAGE_ID = CONFIG.villageId || 'demo-village';
const VOICE_BUCKET_ID = CONFIG.buckets?.voice || 'demo-voice';
function assertConfig() {
  if (!ENV_ID || !PUBLISHABLE_KEY ||
      /^YOUR_/i.test(ENV_ID) || /^YOUR_/i.test(PUBLISHABLE_KEY)) {
    throw new Error('尚未配置云端参数：请复制 config.example.js 为 config.js，并填写你的 CloudBase 环境 ID 与 Publishable Key。');
  }
}
let app,auth,db,voiceBucket,busy=false,lastData={spots:[],works:[],votes:[],feedback:[]};
const $=id=>document.getElementById(id);
function status(text,kind=''){ $('state').textContent=text; $('state').className='status '+kind; }
function init(){assertConfig();if(app)return;if(!window.cloudbase?.init)throw new Error('CloudBase SDK 未加载，请刷新页面或检查网络。');app=window.cloudbase.init({env:ENV_ID,accessKey:PUBLISHABLE_KEY,region:REGION});auth=app.auth;db=app.rdb();voiceBucket=app.storage.from(VOICE_BUCKET_ID);}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(v){if(!v)return '时间未记录';const d=new Date(v);return Number.isNaN(d.valueOf())?String(v):d.toLocaleString('zh-CN',{hour12:false});}
function showError(e){return esc(e?.message||e?.error_description||'读取失败，请检查网络、登录和数据库权限。');}
async function verifyEditor(){init();const {data:s,error}=await auth.getSession();if(error)throw error;const session=s?.session;if(!session?.user||session.user.is_anonymous)throw new Error('请使用编辑者账号登录。');const {data:rows,error:roleError}=await db.from('editors').select('user_uid').eq('user_uid',session.user.id);if(roleError)throw roleError;if(!rows?.length)throw new Error('此账号没有花木村后台权限，请确认账号已登记在 editors 表。');}
async function getAll(){if(busy)return;busy=true;$('refreshBtn').disabled=true;status('正在读取…');try{await verifyEditor();const [sr,wr,vr,fr]=await Promise.all([db.from('spots').select('id,name,sort_order,is_open').eq('village_id',VILLAGE_ID).order('sort_order'),db.from('works').select('id,spot_id,title,sort_order,image_url').order('sort_order'),db.from('votes').select('id,spot_id,work_id,created_at').order('created_at',{ascending:false}),db.from('feedback').select('id,spot_id,message,voice_url,created_at').order('created_at',{ascending:false})]);for(const r of [sr,wr,vr,fr])if(r.error)throw r.error;const ids=new Set((sr.data||[]).map(s=>s.id));lastData={spots:sr.data||[],works:(wr.data||[]).filter(w=>ids.has(w.spot_id)),votes:(vr.data||[]).filter(v=>ids.has(v.spot_id)),feedback:(fr.data||[]).filter(f=>ids.has(f.spot_id))};$('spotTotal').textContent=lastData.spots.length;$('voteTotal').textContent=lastData.votes.length;$('feedbackTotal').textContent=lastData.feedback.length;await draw();status('已更新','ok');}catch(e){console.error('records dashboard error',e);status('读取失败','error');$('points').innerHTML=`<div class="all-empty">${showError(e)}<br><br>如果是“权限不足”，请确认已执行编辑者查看 votes、feedback 的权限脚本。</div>`;}finally{busy=false;$('refreshBtn').disabled=false;}}
async function draw(){const root=$('points');root.replaceChildren();const {spots,works,votes,feedback}=lastData;if(!spots.length){root.innerHTML='<div class="all-empty">地图数据库里还没有点位。添加点位后，点击“刷新数据”即可显示。</div>';return;}for(const s of spots){const ws=works.filter(w=>w.spot_id===s.id),vs=votes.filter(v=>v.spot_id===s.id),fs=feedback.filter(f=>f.spot_id===s.id);const card=document.createElement('section');card.className='point';const seq=Number(s.sort_order)||0;card.innerHTML=`<div class="point-head"><div class="point-title">${seq?String(seq).padStart(2,'0')+'号点位':'地图点位'} <small>${esc(s.name||'未命名点位')}</small></div><div class="point-meta">${s.is_open?'开放':'已关闭'} · ${vs.length}票 · ${fs.length}条意见</div></div><div class="point-body"><div class="works"><div class="section-title">作品票数</div></div><div><div class="section-title">村民意见</div><div class="feedback-list"></div></div></div>`;const wr=card.querySelector('.works');if(!ws.length)wr.insertAdjacentHTML('beforeend','<div class="empty">暂无作品</div>');for(const w of ws){const n=vs.filter(v=>v.work_id===w.id).length,p=vs.length?Math.round(n/vs.length*100):0;const row=document.createElement('div');row.className='work';const thumb=document.createElement('div');thumb.className='work-thumb';if(w.image_url){const image=document.createElement('img');image.src=w.image_url;image.alt=(w.title||'方案')+'图片';image.loading='lazy';image.onerror=()=>{thumb.replaceChildren();thumb.textContent='▧';thumb.setAttribute('aria-label','图片无法加载');};thumb.appendChild(image);}else{thumb.textContent='▧';thumb.setAttribute('aria-label','未上传方案图片');}const copy=document.createElement('div');copy.className='work-copy';copy.innerHTML=`<div class="work-name">${esc(w.title||'未命名作品')}</div><div class="bar"><i style="width:${p}%"></i></div>`;const count=document.createElement('div');count.className='work-count';count.innerHTML=`${n}<small> 票 · ${p}%</small>`;row.append(thumb,copy,count);wr.appendChild(row);}const fr=card.querySelector('.feedback-list');if(!fs.length)fr.innerHTML='<div class="empty">暂无意见</div>';for(const f of fs){const row=document.createElement('article');row.className='feedback';const hasAudio=!!f.voice_url;row.innerHTML=`<div class="feedback-top"><span>${hasAudio?'语音意见':'文字意见'}</span><time>${esc(dateText(f.created_at))}</time></div>${f.message?`<div class="feedback-text">${esc(f.message)}</div>`:''}${hasAudio?'<div class="audio-wait">正在准备语音…</div>':''}`;fr.appendChild(row);if(hasAudio){try{let src=f.voice_url;if(!/^data:|^https?:/i.test(src)){const {data,error}=await voiceBucket.createSignedUrl(src,3600);if(error)throw error;src=data?.fullSignedURL||data?.signedUrl||data?.signedURL||'';}if(!src)throw new Error('没有取得播放地址');const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=src;row.querySelector('.audio-wait').replaceWith(audio);}catch(e){row.querySelector('.audio-wait').textContent='语音无法播放：'+(e?.message||'请检查编辑者的语音读取权限。');}}}root.appendChild(card);}}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"';}
async function exportCsv(){try{await verifyEditor();const {spots,works,votes,feedback}=lastData;const lines=[['点位序号','点位名称','作品名称','票数','意见时间','文字意见','语音文件路径']];for(const s of spots){const seq=Number(s.sort_order)||'';for(const w of works.filter(x=>x.spot_id===s.id)){lines.push([seq,s.name,w.title,votes.filter(v=>v.spot_id===s.id&&v.work_id===w.id).length,'','','']);}for(const f of feedback.filter(x=>x.spot_id===s.id))lines.push([seq,s.name,'意见','',dateText(f.created_at),f.message||'',f.voice_url||'']);}const blob=new Blob(['\ufeff'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='花木村投票记录.csv';a.click();URL.revokeObjectURL(a.href);}catch(e){alert(e?.message||'导出失败');}}
function voiceObjectPath(value){if(!value||/^data:/i.test(value))return null;try{if(/^https?:/i.test(value)){const pathname=decodeURIComponent(new URL(value).pathname);const marker='/' + VOICE_BUCKET_ID + '/';const at=pathname.indexOf(marker);return at>=0?pathname.slice(at+marker.length):null;}return String(value).replace(/^\/+/, '');}catch{return null;}}
async function resetVotingData(){
  const button=$('resetVotingBtn');
  try{
    await verifyEditor();
    const votes=lastData.votes||[], feedback=lastData.feedback||[];
    if(!confirm(`确定清空花木村的投票和村民意见并重新开始吗？\n\n当前将删除：${votes.length} 票、${feedback.length} 条意见。\n地图、点位、作品和作品图片会保留。此操作不能撤销。`))return;
    button.disabled=true; status('正在清空…');
    const {data,error}=await db.rpc('reset_huamu_voting_data');
    if(error){const message=error.message||'';if(/does not exist|PGRST202|404/i.test(message))throw new Error('清空功能尚未启用：请先在 CloudBase PostgreSQL SQL 编辑器运行 records-dashboard-reset.sql。');throw new Error(message||'清空失败，请检查管理员权限。');}
    const result=Array.isArray(data)?data[0]:data;
    const voicePaths=[...new Set(feedback.map(row=>voiceObjectPath(row.voice_url)).filter(Boolean))];
    let audioWarning='';
    if(voicePaths.length){try{const {error:removeError}=await voiceBucket.remove(voicePaths);if(removeError)throw removeError;}catch(removeError){audioWarning='投票和意见已清空，但部分语音文件未能删除：'+(removeError?.message||'请检查语音存储删除权限。');}}
    await getAll();
    if(audioWarning){status('已清空，语音清理未完成','error');alert(audioWarning);}
    else{status('已重新开始投票','ok');alert(`已清空 ${Number(result?.deleted_votes??votes.length)} 票和 ${Number(result?.deleted_feedback??feedback.length)} 条意见。村民现在可以重新投票。`);}
  }catch(error){status('清空失败','error');alert(error?.message||'清空失败，请确认已运行配套 SQL。');}
  finally{button.disabled=false;}
}
$('resetVotingBtn').addEventListener('click',resetVotingData);
$('loginBtn').addEventListener('click',async()=>{const username=$('username').value.trim(),password=$('password').value;if(!username||!password){$('loginStatus').textContent='请填写账号和密码';return;}const b=$('loginBtn');b.disabled=true;$('loginStatus').textContent='正在登录…';try{init();const {error}=await auth.signInWithPassword({username,password});if(error)throw error;await verifyEditor();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('loginStatus').textContent='';await getAll();}catch(e){$('loginStatus').textContent=e?.message||'登录失败，请检查账号、密码和后台权限。';}finally{b.disabled=false;}});
$('refreshBtn').addEventListener('click',getAll);$('exportBtn').addEventListener('click',exportCsv);$('logoutBtn').addEventListener('click',async()=>{try{if(auth)await auth.signOut();}finally{$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';status('请登录');}});
(async()=>{try{init();const {data,error}=await auth.getSession();if(error)throw error;if(data?.session?.user&&!data.session.user.is_anonymous){await verifyEditor();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await getAll();}}catch(e){$('loginStatus').textContent='请登录编辑者账号后查看记录。';}})();
</script>
</body>
</html>
